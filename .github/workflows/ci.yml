name: Build and Test

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libyaml-cpp-dev libboost-all-dev libasio-dev zlib1g-dev

    - name: Install DuckDB C API
      run: |
        mkdir -p /tmp/duckdb
        curl -fsSL https://install.duckdb.org/v1.5.4/libduckdb-linux-amd64.zip -o /tmp/libduckdb.zip
        echo "838d98a85e697bab9935010c88a8c67d3312ccedcab4cb4a0ba01da65113bb70  /tmp/libduckdb.zip" | sha256sum --check
        unzip -q /tmp/libduckdb.zip -d /tmp/duckdb

    - name: Create build directory
      run: mkdir -p _build

    - name: Configure
      run: cd _build && cmake .. -DDUCKDB_ROOT=/tmp/duckdb

    - name: Build
      run: cd _build && make -j$(nproc)

    - name: Bundle DuckDB runtime
      run: cp /tmp/duckdb/libduckdb.so _build/libduckdb.so

    - name: Run tests
      run: cd _build && ./tests/run_tests

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-files
        path: |
          _build/tdxhq_server
          _build/libtdx_api.so
          _build/libduckdb.so
        retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: release-files

    - name: Set executable
      run: chmod +x tdxhq_server libtdx_api.so libduckdb.so

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        body: 'TDX Stock Market Data API Server'
        files: |
          tdxhq_server
          libtdx_api.so
          libduckdb.so
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
